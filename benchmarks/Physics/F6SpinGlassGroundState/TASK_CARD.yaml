schema_version: 2
scientific_question: Can a search find the exact ground state of one fixed fresh L=12 periodic three-dimensional F6 planted spin glass, rather than merely return a strong near-optimal state?
artifact: A deterministic solve_ising(problem) function returning exactly 1728 literal integer spins in {-1,+1} as a flat list.
oracle:
  model: Exact integer evaluation of H=sum J_ij*s_i*s_j over 5184 unique public nearest-neighbour edges; the F6 cube decomposition proves the lower bound -2592.
  feasibility: The callable must return a flat list of exactly 1728 literal integers, each -1 or +1; malformed values and energies below the proved bound are invalid and score zero.
  deterministic: true
  determinism_note: The same hash-pinned fixed public instance is passed as a fresh payload on every evaluation; no evaluator RNG or write occurs.
normalization:
  baseline: The all-plus-one state has exact energy 0 and score 0.
  reference: The exact attainable F6 cube lower bound is -2592 and scores 1; a private fixed witness was independently regraded at -2592 but is not distributed.
  score: max(0,(0-E)/(0-(-2592))) for valid E, capped at 1 by the checked physical lower bound; exact energy, gap and ground-state hit are separate metrics.
citations:
- id: doi:10.1103/PhysRevE.97.043303
  title: 'From Near to Eternity: Spin-glass planting, tiling puzzles, and constraint satisfaction problems'
- id: arxiv:1711.04083
  title: 'From Near to Eternity: Spin-glass planting, tiling puzzles, and constraint satisfaction problems'
invariants:
- The public JSON has raw SHA-256 bcb95c8bcbf1de65b4757f1d83418e8ab3a4d3277f7d6424837c5440faeee4a6, exactly four documented keys, L=12, n=1728 and 5184 unique edges.
- H has no leading minus sign and counts each unique undirected edge exactly once; global spin reversal preserves H.
- The 432 edge-disjoint F6 cubes each have exact local minimum -6 with degeneracy 16, so every spin assignment has H>=-2592.
- A separately held private witness with content SHA-256 dc0b9f5a6315c2ba591e45aaaa436be98916395c1d7b8d359f6ad6bb98602748 was independently evaluated at -2592; this hash is provenance, not a cryptographic proof.
- Candidate mutation of the fresh public payload cannot change the evaluator's immutable trusted edges, n or bound.
known_shortcuts: The fixed couplings, planted-family structure and exact target are public, so this is not anti-contamination or a hidden-answer security claim. Recalling the paper or target is insufficient because scoring recomputes the submitted literal vector. The exploratory Astra result at energy -2572 is a strong approximation, not evidence that the model knows nothing, a success-rate estimate, or a computational lower bound.
