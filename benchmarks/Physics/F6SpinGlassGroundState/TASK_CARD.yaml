invariants:
- The public JSON has raw SHA-256 bcb95c8bcbf1de65b4757f1d83418e8ab3a4d3277f7d6424837c5440faeee4a6, exactly
  four documented keys, L=12, n=1728 and 5184 unique edges.
- H has no leading minus sign and counts each unique undirected edge exactly once; global spin reversal preserves
  H.
- The 432 edge-disjoint F6 cubes each have exact local minimum -6 with degeneracy 16, so every spin assignment
  has H>=-2592.
- A separately held private witness with content SHA-256 dc0b9f5a6315c2ba591e45aaaa436be98916395c1d7b8d359f6ad6bb98602748
  was independently evaluated at -2592; this hash is provenance, not a cryptographic proof.
- Candidate mutation of the fresh public payload cannot change the evaluator's immutable trusted edges, n or
  bound.
known_shortcuts: 'The fixed couplings, planted-family structure and exact target are public; this is not an
  anti-contamination claim. The original exploratory Astra artifact at energy -2572 is not formal SLE calibration.
  The 2026-09-11 fixed Linux pilot at source 13a3dfb3f6aaf5076b3a2e003a1ac7e1c1a80edc ran five frozen programs
  twice each: all-plus 0; replica exchange 0.9861111111111112 (energy -2556); greedy local descent with 256
  starts 0.7901234567901234 (-2048); independent temperature chains without exchange 0.9845679012345679 (-2552);
  no final quench 0.9861111111111112 (-2556). All ten results are valid and each full metric pair repeats exactly.
  The strong no-exchange alternative is included in the executable probe contract; it exceeds the unchanged
  reference*0.9 threshold 0.8875. Final quench has zero measured benefit. No grid search, model draw, or difficulty
  pass is claimed; qualification remains blocked.'
