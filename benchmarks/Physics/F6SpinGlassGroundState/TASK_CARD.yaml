schema_version: 2
scientific_question: Can a search find the exact ground state of one fixed fresh L=12 periodic three-dimensional
  F6 planted spin glass, rather than merely return a strong near-optimal state?
artifact: A deterministic solve_ising(problem) function returning exactly 1728 literal integer spins in {-1,+1}
  as a flat list.
oracle:
  model: Exact integer evaluation of H=sum J_ij*s_i*s_j over 5184 unique public nearest-neighbour edges; the
    F6 cube decomposition proves the lower bound -2592.
  feasibility: The callable must return a flat list of exactly 1728 literal integers, each -1 or +1; malformed
    values and energies below the proved bound are invalid and score zero.
  deterministic: true
  determinism_note: The same hash-pinned fixed public instance is passed as a fresh payload on every evaluation;
    no evaluator RNG or write occurs.
normalization:
  baseline: The all-plus-one state has exact energy 0 and score 0.
  reference: 'The mathematical score-one anchor remains the exact attainable F6 bound -2592, supported by the
    original privately audited witness. verification/reference_tempering.py is an independently written public-input-only
    method scoring 0.9861111111111112 in the fixed Linux pilot. It contains no witness and is not a qualified
    admission reference: the simpler no-exchange variant scores 0.9845679012345679 and fails the unchanged
    10% separation requirement.'
  score: max(0,(0-E)/(0-(-2592))) for valid E, capped at 1 by the checked physical lower bound; exact energy,
    gap and ground-state hit are separate metrics.
citations:
- id: doi:10.1103/PhysRevE.97.043303
  title: 'From Near to Eternity: Spin-glass planting, tiling puzzles, and constraint satisfaction problems'
- id: arxiv:1711.04083
  title: 'From Near to Eternity: Spin-glass planting, tiling puzzles, and constraint satisfaction problems'
